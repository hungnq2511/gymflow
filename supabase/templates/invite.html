<!doctype html>
<html lang="vi">
  <body
    style="
      margin: 0;
      background: #f4f7ef;
      color: #172019;
      font-family: Arial, sans-serif;
    "
  >
    <div style="max-width: 560px; margin: 0 auto; padding: 40px 20px">
      <div
        style="
          border-radius: 20px;
          background: #ffffff;
          padding: 32px;
          box-shadow: 0 12px 40px rgba(23, 32, 25, 0.08);
        "
      >
        <p
          style="
            margin: 0 0 8px;
            color: #66813a;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
          "
        >
          GYMFLOW
        </p>
        <h1 style="margin: 0 0 20px; font-size: 26px">Mời bạn tạo tài khoản</h1>
        <p style="line-height: 1.6">
          Xin chào {{ .Data.full_name }}, bạn đã được mời sử dụng cổng hội viên
          GymFlow. Hãy nhấn nút bên dưới để xác nhận email và đặt mật khẩu cho
          tài khoản.
        </p>
        <p style="margin: 28px 0">
          <a
            href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/update-password"
            style="
              display: inline-block;
              border-radius: 10px;
              background: #b8e64d;
              color: #172019;
              padding: 13px 22px;
              font-weight: 700;
              text-decoration: none;
            "
          >
            Tạo tài khoản
          </a>
        </p>
        <p style="color: #667068; font-size: 13px; line-height: 1.5">
          Nếu bạn không mong đợi lời mời này, bạn có thể bỏ qua email.
        </p>
      </div>
    </div>
  </body>
</html>
